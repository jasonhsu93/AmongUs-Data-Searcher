<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Among Us Database - Tasks</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- nav bar -->
    <div class="navbar">
        <div class="logo-container">
            <img src="./amongus_icon.png" alt="Among Us Icon">
            <span class="logo-text">Among Us <span class="database-text">Database</span></span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="player.html">Player</a></li>
            <li><a href="task.html">Task</a></li>
            <li><a href="chat.html">Chat</a></li>
            <li><a href="kills.html">Kills</a></li>
        </ul>
    </div>

    <div class="content">
        <h1>Task</h1>
        <h2>Project Tasks with Selected Attributes</h2>
        <form id="fetchTasksForm">
            <p>Select attributes to display</p>
            <label for="attrTaskID">TaskID</label><br>
            <input type="checkbox" id="attrTaskID" name="attributes" value="TaskID" checked>

            <label for="attrTaskName">TaskName</label><br>
            <input type="checkbox" id="attrTaskName" name="attributes" value="TaskName" checked>

            <label for="attrRoomName">RoomName</label><br>
            <input type="checkbox" id="attrRoomName" name="attributes" value="RoomName" checked>

            <label for="attrComplete">Complete</label><br><br>
            <input type="checkbox" id="attrComplete" name="attributes" value="Complete" checked>

            <button type="submit">Project Tasks</button>
        </form>

        <table id="taskTable">
            <thead>
                <tr id="taskTableHeader"></tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="data-section">
            <h2>Number of Tasks in Each Room</h2>
            <table id="tasksGroupedByRoomTable" class="data-table">
                <thead>
                    <tr>
                        <th>Room Name</th>
                        <th>Task Count</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <button id="tasksGroupedByRoom" class="fetch-button">Check Rooms</button>
        </div>
        <div class="data-section">
            <h2>Rooms with Multiple Tasks</h2>
            <table id="roomMultipleTasksTable" class="data-table">
                <thead>
                    <tr>
                        <th>Room Name</th>
                        <th>Task Count</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <button id="roomMultipleTasks" class="fetch-button">Check Rooms</button>
        </div>
    </div>

    <script src="task.js"></script>
</body>
<footer><p>Among Us Database</p></footer>
</html>
